name: CI & Build Pipeline

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Lint & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 1. Ana CLI Paketinin Derlenmesi
      - name: Install Root Dependencies
        run: npm ci

      - name: Build Core CLI
        run: npm run build

      - name: Verify Package Dry-Run
        run: npm pack --dry-run

      # 2. VS Code Extension Derlenmesi ve Paketlenmesi
      - name: Install VS Code Extension Dependencies
        working-directory: ./vscode-extension
        run: npm ci

      - name: Build VS Code Extension
        working-directory: ./vscode-extension
        run: npm run build

      - name: Package VSIX
        working-directory: ./vscode-extension
        run: npx @vscode/vsce package --no-dependencies

      # 3. Tag gelirse otomatik GitHub Release ve VSIX artifact yükleme
      - name: Upload VSIX Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode-extension/*.vsix

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: vscode-extension/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}